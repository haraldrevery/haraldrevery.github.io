<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/main.css">
    <title>Harald Revery - Time</title>

    <link rel="preload" href="/fonts/HaraldReveryTextFont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/HaraldReveryMonoFont.woff2" as="font" type="font/woff2" crossorigin>

    <!--  Open Graph (social media image thing) -->
    <meta property="og:title" content="Harald Revery - Time" />
    <meta property="og:description" content="Revery | The time is ticking." />
    <meta property="og:image" content="https://haraldrevery.com/notebook_thumbnails/timeclock.jpg" />
    <meta property="og:url" content="https://haraldrevery.com/clock/" />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://haraldrevery.com/clock/">

     <!-- test CSP -->
    <meta http-equiv="Content-Security-Policy" 
      content="default-src 'self'; 
               style-src 'self' 'unsafe-inline'; 
               font-src 'self' data:; 
               img-src 'self' data: blob:; 
               script-src 'self' 'unsafe-inline';">

    <!-- Internet icon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="shortcut icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#171717">


    <link rel="stylesheet" href="/clock/css/clock.css">
</head>
<body>

    <div class="hero-container_legacy">
        <div class="bg-texture_legacy"></div>

        <div class="clock-stage">
            <div class="clock-ring-wrap">
                <svg class="clock-svg-ring" id="clock-ring-svg" width="600" height="600" viewBox="-300 -300 600 600" xmlns="http://www.w3.org/2000/svg">
                    <g id="clock-ticks"></g>
                    <circle class="clock-ring-track" r="270" stroke-width="1"/>
                    <circle class="clock-ring-progress" id="clock-progress-arc" r="270" stroke-width="1.5" transform="rotate(-90)"/>
                </svg>

                    <svg class="clock-svg-ring" id="clock-hourglass-svg" width="600" height="600" viewBox="-300 -300 600 600" xmlns="http://www.w3.org/2000/svg" style="display: none; opacity: 0.52;">
                        <g opacity="1.0" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M -90 -240 C -90 -100, -4 -60, -3 0 C -3 60, -90 100, -90 240" />
                            <path d="M 90 -240 C 90 -100, 4 -60, 3 0 C 3 60, 90 100, 90 240" />
                            <line x1="-120" y1="-240" x2="120" y2="-240"/>
                            <line x1="-120" y1="240" x2="120" y2="240"/>
                        </g>
                        <clipPath id="top-bulb-clip">
                            <path d="M -90 -240 C -90 -100, -4 -60, -3 0 L 3 0 C 4 -60, 90 -100, 90 -240 Z"/>
                        </clipPath>
                        <clipPath id="bot-bulb-clip">
                            <path d="M -3 0 C -3 60, -90 100, -90 240 L 90 240 C 90 100, 3 60, 3 0 Z"/>
                        </clipPath>
                        <g fill="currentColor" opacity="1.0">
                            <rect id="hg-top-sand" x="-100" y="-240" width="200" height="240" clip-path="url(#top-bulb-clip)" />
                            <rect id="hg-bot-sand" x="-100" y="0" width="200" height="0" clip-path="url(#bot-bulb-clip)" />
                        </g>
                        <rect id="hg-stream-dot" x="-1.5" y="-10" width="3" height="20" fill="currentColor" style="opacity: 0; transition: opacity 0.2s;" />
                    </svg>

                <div class="clock-time" id="clock-time" title="Click to set timer">00:00:00</div>
            </div>

            <div class="clock-bottom-info">
                <div class="clock-date" id="clock-date" title="Click to create event card">Wednesday, 1 January 2025</div>
                <div class="clock-timezone" id="clock-timezone">UTC+00:00</div>
            </div>

            <div class="timer-modal" id="timer-modal">
                <div class="timer-mode-row">
                    <button class="timer-mode-btn active" id="mode-timer-btn">Timer</button>
                    <button class="timer-mode-btn" id="mode-alarm-btn">Alarm</button>
                    <button class="timer-mode-btn" id="mode-settings-btn">Settings</button>
                </div>
                <div id="timer-section">
                    <div class="timer-inputs">
                        <input type="number" id="t-hr" min="0" max="99" value="00" placeholder="HH"> :
                        <input type="number" id="t-min" min="0" max="59" value="05" placeholder="MM"> :
                        <input type="number" id="t-sec" min="0" max="59" value="00" placeholder="SS">
                    </div>
                </div>
                <div id="alarm-section" style="display:none">
                    <div class="timer-inputs" style="justify-content:center">
                        <input type="number" id="a-hr" min="0" max="23" value="08" placeholder="HH"> :
                        <input type="number" id="a-min" min="0" max="59" value="00" placeholder="MM">
                    </div>
                    <div id="alarm-label">set alarm time (24 h)</div>
                </div>
                <div id="settings-section" style="display:none">
                    <div id="settings-label" style="font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.14em;opacity:0.45;text-align:center;text-transform:uppercase;margin-bottom:0.75rem;">Language</div>
                    <div class="timer-mode-row">
                        <button class="timer-mode-btn" id="lang-en-btn">EN — English</button>
                        <button class="timer-mode-btn" id="lang-sv-btn">SV — Svenska</button>
                    </div>

                    <div id="anim-settings-label" style="font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.14em;opacity:0.45;text-align:center;text-transform:uppercase;margin-top:1.2rem;margin-bottom:0.75rem;">Animation</div>
                    <div class="timer-mode-row">
                        <button class="timer-mode-btn" id="anim-ring-btn">Ring</button>
                        <button class="timer-mode-btn" id="anim-hg-btn">Hourglass</button>
                    </div>
                </div>
                <div class="timer-buttons">
                    <button id="btn-cancel">Cancel</button>
                    <button id="btn-start">Start Timer</button>
                </div>
            </div>
        </div>

        <div class="text-overlay_legacy" style="bottom: 0.9rem;">
            <a href="/index.html" style="pointer-events:auto; text-decoration:none; color:inherit;">
                haraldrevery.com
            </a>
        </div>

        <div class="mode-toggle_legacy" id="mode-toggle_legacy">
            <span id="mode-icon_legacy">☀</span>
        </div>

        <audio id="alarm-sound" src="/clock/audio/timer_alarm_1.mp3" preload="auto"></audio>
    </div>

    <div class="ecm-overlay" id="ecm-overlay">
        <div class="ecm-modal">
            <div class="ecm-header">
                <span class="ecm-header-title">Create Event Card</span>
                <button class="ecm-close-btn" id="ecm-close">✕ close</button>
            </div>
            <div class="ecm-body">
                <div class="ecm-col-form">



                    <div>
                        <label class="ecm-label" style="margin-bottom:0.45rem;">Title</label>
                        <input class="ecm-input" id="ecm-title" type="text" placeholder="Event name..." maxlength="80">
                    </div>


                    <div>
                        <label class="ecm-label">Author / Contact</label>
                        <input class="ecm-input" id="ecm-author" type="text" placeholder="Name or email..." maxlength="80">
                    </div>

                    <div>
                        <label class="ecm-label">Description — markdown supported</label>
                        <textarea class="ecm-textarea" id="ecm-desc" rows="5"
                            placeholder="# Heading&#10;**bold**, *italic*, `code`&#10;- list item"></textarea>
                    </div>

                    <div>
                        <label class="ecm-label">Date</label>
                        <div class="ecm-cal" id="ecm-cal"></div>
                    </div>

                    <div class="ecm-row-2">
                        <div>
                            <label class="ecm-label">Card Theme</label>
                            <div class="ecm-toggle-row" id="ecm-theme-row">
                                <button class="ecm-toggle-btn active" data-theme="dark">Dark</button>
                                <button class="ecm-toggle-btn" data-theme="light">Light</button>
                            </div>
                        </div>

                        <div>
                            <label class="ecm-label">Language / Date</label>
                            <div class="ecm-toggle-row" id="ecm-lang-row">
                                <button class="ecm-toggle-btn active" data-lang="en">EN</button>
                                <button class="ecm-toggle-btn" data-lang="sv">SV</button>
                                <button class="ecm-toggle-btn" data-lang="off">OFF</button> 
                            </div>
                        </div>
                    </div>

                    <div class="ecm-row-2" style="margin-top: 1.1rem;">
                        <div>
                            <label class="ecm-label">Align Header</label>
                            <div class="ecm-toggle-row" id="ecm-align-row">
                                <button class="ecm-toggle-btn active" data-align="left">Left</button>
                                <button class="ecm-toggle-btn" data-align="center">Center</button>
                                <button class="ecm-toggle-btn" data-align="right">Right</button>
                            </div>
                        </div>
                        <div>
                            <label class="ecm-label">Author Pos.</label>
                            <div class="ecm-toggle-row" id="ecm-author-pos-row">
                                <button class="ecm-toggle-btn active" data-author-pos="opposite">Opposite</button>
                                <button class="ecm-toggle-btn" data-author-pos="diagonal">Diagonal</button>
                            </div>
                        </div>
                    </div>


                    <div class="ecm-row-2">
                        <div>
                            <label class="ecm-label">Texture</label>
                            <div class="ecm-toggle-row" id="ecm-texture-row">
                                <button class="ecm-toggle-btn active" data-texture="false">Off</button>
                                <button class="ecm-toggle-btn" data-texture="true">On</button>
                            </div>
                        </div>
                            <div>
                                <label class="ecm-label">Justify Text</label>
                                <div class="ecm-toggle-row" id="ecm-justify-row">
                                    <button class="ecm-toggle-btn" data-justify="false">Off</button>
                                    <button class="ecm-toggle-btn active" data-justify="true">On</button>
                                </div>
                            </div>
                    </div>
                    


                        <div class="ecm-row-2">
                            <div>
                                <label class="ecm-label">Background Graphic</label>
                                <div class="ecm-toggle-row" id="ecm-graphic-row">
                                    <button class="ecm-toggle-btn active" data-graphic="ring">Ring</button>
                                    <button class="ecm-toggle-btn" data-graphic="logo">Logo</button>
                                    <button class="ecm-toggle-btn" data-graphic="none">Off</button>
                                </div>
                            </div>
                            <div>
                                <label class="ecm-label">Show Title</label>
                                <div class="ecm-toggle-row" id="ecm-show-title-row">
                                    <button class="ecm-toggle-btn active" data-show-title="true">On</button>
                                    <button class="ecm-toggle-btn" data-show-title="false">Off</button>
                                </div>
                            </div>
                        </div>

                    <div class="ecm-row-2">
                        <div>
                            <label class="ecm-label">Title Color</label>
                            <input type="color" id="ecm-color-title" value="#ffffff" style="width:100%; cursor:pointer; background:transparent;">
                        </div>
                        <div>
                            <label class="ecm-label">Date Color</label>
                            <input type="color" id="ecm-color-date" value="#a1a1a1" style="width:100%; cursor:pointer; background:transparent;">
                        </div>
                    </div>
                    
                    <div class="ecm-row-2">
                        <div>
                            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:0.2rem;">
                                <label class="ecm-label" style="margin-bottom:0;">Font Scale</label>
                                <span id="ecm-font-scale-val" style="font-size:0.6rem; opacity:0.6;">1.00x</span>
                            </div>
                            <input type="range" class="ecm-slider" id="ecm-font-scale" min="0.9" max="8.0" step="0.05" value="1.5">
                        </div>
                        <div>
                            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:0.2rem;">
                                <label class="ecm-label" style="margin-bottom:0;">Edge Padding</label>
                                <span id="ecm-pad-scale-val" style="font-size:0.6rem; opacity:0.6;">1.00x</span>
                            </div>
                            <input type="range" class="ecm-slider" id="ecm-pad-scale" min="0.5" max="5.0" step="0.05" value="1.0">
                        </div>
                    </div>


                <div class="ecm-row-2" style="margin-top: 0.5rem;">
                    <div>
                        <label class="ecm-label">Columns</label>
                        <div class="ecm-toggle-row" id="ecm-columns-row">
                            <button class="ecm-toggle-btn active" data-columns="1">1</button>
                            <button class="ecm-toggle-btn" data-columns="2">2</button>
                            <button class="ecm-toggle-btn" data-columns="3">3</button>
                        </div>
                    </div>
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:0.2rem;">
                            <label class="ecm-label" style="margin-bottom:0;" title="Adjust horizontal vs vertical padding">Pad Bias (Y↔X)</label>
                            <span id="ecm-pad-ratio-val" style="font-size:0.6rem; opacity:0.6;">0.00</span>
                        </div>
                        <input type="range" class="ecm-slider" id="ecm-pad-ratio" min="-0.8" max="0.8" step="0.05" value="0">
                    </div>
                </div>
                    <div>
                        <label class="ecm-label">Export Format</label>
                        <div class="ecm-formats" id="ecm-formats"></div>
                    </div>

                </div>

                <div class="ecm-col-preview">
                    <label class="ecm-label">Preview</label>
                    <div class="ecm-preview-wrap" id="ecm-preview-wrap">
                        <canvas id="ecm-canvas"></canvas>
                    </div>
                    
                    <div style="margin-top: auto;">
                        <label class="ecm-label">File Type</label>
                        <div class="ecm-toggle-row" id="ecm-filetype-row" style="margin-bottom: 0.8rem; flex-wrap: wrap;">
                            <button class="ecm-toggle-btn active" data-file-type="jpg">JPG</button>
                            <button class="ecm-toggle-btn" data-file-type="png">PNG</button>
                            <button class="ecm-toggle-btn" data-file-type="png_transp">PNG Transp.</button>
                        </div>
                    </div>

                    <button class="ecm-export-btn" id="ecm-export-btn">↓ &nbsp; Export Card</button>
                </div>
                
            </div>
        </div>
    </div>

<script src="/clock/js/clock.js" defer></script>

<script src="/clock/js/event_card.js" defer></script>
</body>
</html>
