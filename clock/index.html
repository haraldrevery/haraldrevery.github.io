<!DOCTYPE html>
<html lang="en" data-theme="dark" data-face="ring" data-size="m" data-format="24" data-seconds="true" data-mode="clock">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Harald Revery - Time</title>
    <meta name="description" content="A clock, timer, alarm and stopwatch with a few quiet faces to choose from.">

    <!--  Open Graph (social media image thing) -->
    <meta property="og:title" content="Harald Revery - Time" />
    <meta property="og:description" content="Revery | The time is ticking." />
    <meta property="og:image" content="https://haraldrevery.com/notebook_thumbnails/timeclock.jpg" />
    <meta property="og:url" content="https://haraldrevery.com/clock/" />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://haraldrevery.com/clock/">

    <!-- No blob: in img-src on purpose: the live Cloudflare header CSP does not
         allow it either, so anything that relies on blob: images fails here
         first instead of only on the live site. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               style-src 'self' 'unsafe-inline';
               font-src 'self' data:;
               img-src 'self' data:;
               media-src 'self';
               connect-src 'self';
               script-src 'self' 'unsafe-inline';">

    <!-- Internet icon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="shortcut icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#171717">

    <link rel="preload" href="/fonts/HaraldReveryMonoFont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/HaraldReveryTextFont.woff2" as="font" type="font/woff2" crossorigin>
    <!-- ?v= on the clock's CSS/JS: Cloudflare and browsers keep these files for
         months, so a changed file only reaches visitors under a new version.
         Change the date in both places whenever clock.css, clock.js,
         event_card.css or event_card.js change (clock.js passes it on to the
         event card files). -->
    <link rel="stylesheet" href="/clock/css/clock.css?v=20260919">

    <!-- Apply saved look before first paint (no theme/face flash). clock.js
         owns the settings; this only mirrors them onto <html>. The custom
         colour fallbacks and luminance() are copies of the ones in clock.js.
         clock-settings is the key's name before 2026-09, read only until
         clock.js has moved it. -->
    <script>
    (function () {
        var d = document.documentElement, s = null;
        try { s = JSON.parse(localStorage.getItem('rvry-clock-settings') || localStorage.getItem('clock-settings')); } catch (e) {}
        s = s || {};
        var face = s.face;
        if (!face) { try { if (localStorage.getItem('clock-anim') === 'hourglass') face = 'hourglass'; } catch (e) {} }
        var theme = s.theme || 'auto';
        if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.setAttribute('data-theme', theme);
        if (theme === 'custom') {
            var hex = /^#[0-9a-f]{6}$/i;
            var bg = hex.test(s.customBg) ? s.customBg : '#14181f';
            var ink = hex.test(s.customInk) ? s.customInk : '#ece6d9';
            var luminance = function (c) {
                var n = parseInt(c.slice(1), 16);
                return [n >> 16, n >> 8 & 255, n & 255].reduce(function (sum, v, i) {
                    v /= 255;
                    v = v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
                    return sum + v * [.2126, .7152, .0722][i];
                }, 0);
            };
            d.style.setProperty('--custom-bg', bg);
            d.style.setProperty('--custom-ink', ink);
            d.setAttribute('data-tone', luminance(bg) < .179 ? 'dark' : 'light');
        }
        if (face) d.setAttribute('data-face', face);
        if (s.size) d.setAttribute('data-size', s.size);
        if (s.seconds === false) d.setAttribute('data-seconds', 'false');
        if (typeof s.bgOpacity === 'number') d.style.setProperty('--bg-opacity', s.bgOpacity);
    }());
    </script>
</head>
<body>

<div class="app" id="app">

    <!-- ============================ Backdrop ============================ -->
    <div class="bg-stage" aria-hidden="true">
        <div class="bg-layer" id="bg-a"></div>
        <div class="bg-layer" id="bg-b"></div>
        <div class="bg-scrim"></div>
    </div>

    <!-- ============================ Top bar ============================= -->
    <header class="frame-top">
        <!-- Running timer / armed alarm / stopwatch, visible from any view -->
        <div class="status">
            <button class="chip status-chip" id="chip-timer" data-goto="timer" hidden></button>
            <button class="chip status-chip" id="chip-alarm" data-goto="alarm" hidden></button>
            <button class="chip status-chip" id="chip-stopwatch" data-goto="stopwatch" hidden></button>
        </div>
        <nav class="modes" aria-label="Mode">
            <button class="mode-btn" data-mode="clock" aria-current="true" data-i18n="mode_clock">Clock</button>
            <button class="mode-btn" data-mode="timer" data-i18n="mode_timer">Timer</button>
            <button class="mode-btn" data-mode="alarm" data-i18n="mode_alarm">Alarm</button>
            <button class="mode-btn" data-mode="stopwatch" data-i18n="mode_stopwatch">Stopwatch</button>
        </nav>
        <div></div>
    </header>

    <!-- ============================= Stage ============================== -->
    <main class="stage">

        <!-- ========== CLOCK ========== -->
        <section class="view active" data-view="clock">

            <!-- Ring -->
            <div class="face face-ring" data-face-id="ring">
                <div class="ring-wrap">
                    <svg class="ring-svg" viewBox="-300 -300 600 600" aria-hidden="true">
                        <g id="ring-ticks"></g>
                        <circle class="ring-track" r="270"/>
                        <circle class="ring-arc" id="ring-arc" r="270" transform="rotate(-90)"/>
                    </svg>
                    <button class="time-btn ring-time" data-goto="timer" data-i18n-title="set_timer" title="Set a timer">
                        <span class="digits" id="ring-time">00:00:00</span><span class="ampm" id="ring-ampm"></span>
                    </button>
                </div>
                <div class="face-info">
                    <button class="date-link" data-card id="ring-date" data-i18n-title="make_card" title="Create an event card"></button>
                    <div class="tz" id="ring-tz"></div>
                </div>
            </div>

            <!-- Hourglass: flips every hour, the sand drains over the hour -->
            <div class="face face-hourglass" data-face-id="hourglass">
                <div class="hg-wrap">
                    <svg class="hg-svg" id="hg-svg" viewBox="-300 -300 600 600" aria-hidden="true">
                        <g stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M -90 -240 C -90 -100, -4 -60, -3 0 C -3 60, -90 100, -90 240"/>
                            <path d="M 90 -240 C 90 -100, 4 -60, 3 0 C 3 60, 90 100, 90 240"/>
                            <line x1="-120" y1="-240" x2="120" y2="-240"/>
                            <line x1="-120" y1="240" x2="120" y2="240"/>
                        </g>
                        <clipPath id="hg-top-clip">
                            <path d="M -90 -240 C -90 -100, -4 -60, -3 0 L 3 0 C 4 -60, 90 -100, 90 -240 Z"/>
                        </clipPath>
                        <clipPath id="hg-bot-clip">
                            <path d="M -3 0 C -3 60, -90 100, -90 240 L 90 240 C 90 100, 3 60, 3 0 Z"/>
                        </clipPath>
                        <g fill="currentColor">
                            <rect id="hg-top-sand" x="-100" y="-240" width="200" height="240" clip-path="url(#hg-top-clip)"/>
                            <rect id="hg-bot-sand" x="-100" y="0" width="200" height="0" clip-path="url(#hg-bot-clip)"/>
                        </g>
                        <rect id="hg-stream" class="hg-stream" x="-1.5" y="-10" width="3" height="20" fill="currentColor"/>
                    </svg>
                    <button class="time-btn hg-time" data-goto="timer" data-i18n-title="set_timer" title="Set a timer">
                        <span class="digits" id="hg-time">00:00:00</span><span class="ampm" id="hg-ampm"></span>
                    </button>
                </div>
                <div class="face-info">
                    <button class="date-link" data-card id="hg-date" data-i18n-title="make_card" title="Create an event card"></button>
                    <div class="tz" id="hg-tz"></div>
                </div>
            </div>

            <!-- Mono -->
            <div class="face face-mono" data-face-id="mono">
                <button class="time-btn mono-time" data-goto="timer" data-i18n-title="set_timer" title="Set a timer">
                    <span class="digits" id="mono-time">00:00:00</span><span class="ampm" id="mono-ampm"></span>
                </button>
                <div class="mono-footer">
                    <div class="left" id="mono-numeric"></div>
                    <button class="center date-link" data-card id="mono-weekday" data-i18n-title="make_card" title="Create an event card"></button>
                    <div class="right" id="mono-tz"></div>
                </div>
            </div>

            <!-- Analog -->
            <div class="face face-analog" data-face-id="analog">
                <div class="dial-wrap">
                    <svg viewBox="-100 -100 200 200" aria-hidden="true">
                        <circle class="dial-ring" r="94"/>
                        <circle class="dial-ring dial-ring-inner" r="88"/>
                        <g id="analog-ticks"></g>
                        <g id="analog-numerals"></g>
                        <line class="hand-h" id="analog-h" x1="0" y1="0" x2="0" y2="-52"/>
                        <line class="hand-m" id="analog-m" x1="0" y1="0" x2="0" y2="-78"/>
                        <line class="hand-s sec-el" id="analog-s" x1="0" y1="14" x2="0" y2="-82"/>
                        <circle class="pin-outer" r="3.5"/>
                        <circle class="pin-inner" r="1.2"/>
                    </svg>
                </div>
                <button class="date-link" data-card id="analog-date" data-i18n-title="make_card" title="Create an event card"></button>
            </div>

            <!-- Celestial: hour, minute and second "planets" on three orbits -->
            <div class="face face-celestial" data-face-id="celestial">
                <div class="orbit-wrap">
                    <svg viewBox="-100 -100 200 200" aria-hidden="true">
                        <g id="cel-stars"></g>
                        <line class="meridian" x1="-94" y1="0" x2="94" y2="0"/>
                        <line class="meridian" x1="0" y1="-94" x2="0" y2="94"/>
                        <circle class="orbit-path" r="86"/>
                        <circle class="orbit-path" r="64"/>
                        <circle class="orbit-path sec-el" r="42"/>
                        <g id="cel-marks"></g>
                        <circle class="core-fill" r="16"/>
                        <circle class="core-ring" r="18"/>
                        <circle class="core-ring core-ring-outer" r="22"/>
                        <g id="cel-h">
                            <circle class="planet-h" cx="0" cy="-86" r="4.5"/>
                            <circle class="planet-h planet-halo" cx="0" cy="-86" r="7"/>
                        </g>
                        <g id="cel-m"><circle class="planet-m" cx="0" cy="-64" r="3"/></g>
                        <g id="cel-s" class="sec-el"><circle class="planet-s" cx="0" cy="-42" r="1.6"/></g>
                    </svg>
                </div>
                <div class="cel-meta">
                    <button class="date-link" data-card id="cel-date" data-i18n-title="make_card" title="Create an event card"></button>
                    <span class="dot" aria-hidden="true"></span>
                    <button class="time-btn" data-goto="timer" data-i18n-title="set_timer" title="Set a timer">
                        <span class="digits" id="cel-time">00:00</span><span class="ampm" id="cel-ampm"></span>
                    </button>
                </div>
            </div>
        </section>

        <!-- ========== TIMER ========== -->
        <section class="view" data-view="timer">
            <div class="tool">
                <h2 class="heading" data-i18n="timer_heading">Countdown</h2>

                <div class="big-numerals" id="timer-edit">
                    <input class="num-input" id="timer-in-h" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="00" data-max="99" autocomplete="off" aria-label="Hours" data-i18n-aria="hours">
                    <span class="colon">:</span>
                    <input class="num-input" id="timer-in-m" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="05" data-max="59" autocomplete="off" aria-label="Minutes" data-i18n-aria="minutes">
                    <span class="colon">:</span>
                    <input class="num-input" id="timer-in-s" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="00" data-max="59" autocomplete="off" aria-label="Seconds" data-i18n-aria="seconds_unit">
                </div>
                <div class="big-numerals" id="timer-display" hidden>
                    <span class="digits" id="timer-digits">00:05:00</span>
                </div>
                <!-- Ring / hourglass face while a countdown runs (those two faces
                     only); clock.js puts copies of the clock faces' SVGs in here. -->
                <div class="timer-face" id="timer-face" hidden>
                    <span class="tf-time digits" id="tf-digits">00:05:00</span>
                </div>

                <div class="progress" aria-hidden="true"><span id="timer-progress"></span></div>

                <div class="presets" id="timer-presets">
                    <button class="chip" data-preset="60" data-i18n="preset_1m">1 min</button>
                    <button class="chip" data-preset="180" data-i18n="preset_3m">3 min</button>
                    <button class="chip" data-preset="300" data-i18n="preset_5m">5 min</button>
                    <button class="chip" data-preset="600" data-i18n="preset_10m">10 min</button>
                    <button class="chip" data-preset="900" data-i18n="preset_15m">15 min</button>
                    <button class="chip" data-preset="1500" data-i18n="preset_25m">25 min</button>
                    <button class="chip" data-preset="2700" data-i18n="preset_45m">45 min</button>
                    <button class="chip" data-preset="3600" data-i18n="preset_1h">1 hour</button>
                </div>

                <div class="controls">
                    <button class="btn" id="timer-reset" data-i18n="btn_reset">Reset</button>
                    <button class="btn" data-variant="primary" id="timer-start" data-i18n="btn_start">Start</button>
                </div>
            </div>
        </section>

        <!-- ========== ALARM ========== -->
        <section class="view" data-view="alarm">
            <div class="tool">
                <h2 class="heading" data-i18n="alarm_heading">Alarm</h2>

                <div class="big-numerals" id="alarm-edit">
                    <input class="num-input" id="alarm-in-h" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="07" data-max="23" autocomplete="off" aria-label="Hours" data-i18n-aria="hours">
                    <span class="colon">:</span>
                    <input class="num-input" id="alarm-in-m" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="00" data-max="59" autocomplete="off" aria-label="Minutes" data-i18n-aria="minutes">
                </div>

                <p class="tool-status" id="alarm-status" aria-live="polite"></p>

                <div class="controls">
                    <button class="btn" data-variant="primary" id="alarm-toggle" data-i18n="btn_arm">Arm</button>
                </div>
            </div>
        </section>

        <!-- ========== STOPWATCH ========== -->
        <section class="view" data-view="stopwatch">
            <!-- Laps live in their own row below the controls, so adding
                 one never moves the time or the buttons (see .tool-sw). -->
            <div class="tool tool-sw">
                <h2 class="heading" data-i18n="sw_heading">Stopwatch</h2>

                <div class="big-numerals">
                    <span class="digits" id="sw-digits">00:00:00</span><span class="cs digits" id="sw-cs">.00</span>
                </div>

                <div class="controls">
                    <button class="btn" id="sw-lap" data-i18n="btn_reset" disabled>Reset</button>
                    <button class="btn" data-variant="primary" id="sw-start" data-i18n="btn_start">Start</button>
                </div>

                <div class="sw-log">
                    <div class="sw-log-head" id="sw-log-head" hidden>
                        <span id="sw-lap-count"></span>
                        <button class="chip" id="sw-export" data-i18n="export_csv">Export .csv</button>
                    </div>
                    <ol class="laps" id="sw-laps" reversed></ol>
                </div>
            </div>
        </section>
    </main>

    <!-- Timer finished / alarm ringing — shown over any view -->
    <div class="ring-banner" id="ring-banner" role="alertdialog" aria-labelledby="ring-label" hidden>
        <span class="ring-label" id="ring-label"></span>
        <button class="btn" data-variant="primary" id="ring-dismiss" data-i18n="btn_dismiss">Dismiss</button>
    </div>

    <a class="site-link" href="/">haraldrevery.com</a>

    <!-- ============================ Settings ============================ -->
    <div class="settings-trigger">
        <button class="icon-btn cog" id="cog" aria-label="Settings" data-i18n-aria="settings" aria-expanded="false" aria-controls="settings-panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>

    <aside class="settings-panel" id="settings-panel" aria-label="Settings" data-i18n-aria="settings" inert>
        <div class="panel-head">
            <span data-i18n="settings">Settings</span>
            <button class="icon-btn panel-close" id="panel-close" aria-label="Close" data-i18n-aria="close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>

        <div class="field">
            <span class="field-label" data-i18n="face">Face</span>
            <div class="face-grid">
                <button class="face-thumb" data-set="face=ring">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" opacity=".35"/><path d="M12 3a9 9 0 0 1 8.5 12"/></svg>
                    <span data-i18n="face_ring">Ring</span>
                </button>
                <button class="face-thumb" data-set="face=hourglass">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h11M6.5 21h11M8 3c0 5 3.6 7 3.6 9S8 16 8 21M16 3c0 5-3.6 7-3.6 9s3.6 4 3.6 9"/></svg>
                    <span data-i18n="face_hourglass">Hourglass</span>
                </button>
                <button class="face-thumb" data-set="face=mono">
                    <span class="thumb-text" aria-hidden="true">12:00</span>
                    <span data-i18n="face_mono">Mono</span>
                </button>
                <button class="face-thumb" data-set="face=analog">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12V6.5M12 12l3.8 2.4"/></svg>
                    <span data-i18n="face_analog">Analog</span>
                </button>
                <button class="face-thumb" data-set="face=celestial">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="1 2"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="3" r="1.5" class="fill"/><circle cx="17" cy="12" r="1" class="fill"/></svg>
                    <span data-i18n="face_celestial">Celestial</span>
                </button>
            </div>
        </div>

        <div class="field">
            <span class="field-label" data-i18n="theme">Theme</span>
            <div class="seg-group">
                <button class="seg-btn" data-set="theme=auto" data-i18n="auto">Auto</button>
                <button class="seg-btn" data-set="theme=dark" data-i18n="dark">Dark</button>
                <button class="seg-btn" data-set="theme=light" data-i18n="light">Light</button>
                <button class="seg-btn" data-set="theme=sepia" data-i18n="sepia">Sepia</button>
                <button class="seg-btn" data-set="theme=custom" data-i18n="custom">Custom</button>
            </div>
            <div class="custom-colors" id="custom-colors" hidden>
                <label class="swatch"><input type="color" id="custom-bg" value="#14181f"><span data-i18n="custom_bg">Background</span></label>
                <label class="swatch"><input type="color" id="custom-ink" value="#ece6d9"><span data-i18n="custom_ink">Text</span></label>
            </div>
            <p class="contrast-note" id="contrast-note" data-i18n="low_contrast" hidden>Low contrast: hard to read</p>
        </div>

        <div class="field">
            <span class="field-label" data-i18n="background">Background</span>
            <div class="photo-strip" id="photo-strip"></div>
            <input type="file" id="photo-upload" accept="image/*" hidden>
            <div class="slider-row">
                <label class="sub-label" for="bg-opacity" data-i18n="opacity">Opacity</label>
                <input type="range" id="bg-opacity" min="0" max="100" step="1" value="25">
                <span class="val" id="bg-opacity-val">25%</span>
            </div>
            <div class="seg-group">
                <button class="seg-btn" data-set="bgCycle=false" data-i18n="cycle_locked">Locked</button>
                <button class="seg-btn" data-set="bgCycle=true" data-i18n="cycle_auto">Cycle</button>
                <button class="seg-btn" id="bg-next" data-i18n="next">Next</button>
            </div>
        </div>

        <div class="field field-pair">
            <div>
                <span class="field-label" data-i18n="format">Format</span>
                <div class="seg-group">
                    <button class="seg-btn" data-set="format=24" data-i18n="fmt_24">24 h</button>
                    <button class="seg-btn" data-set="format=12" data-i18n="fmt_12">12 h</button>
                </div>
            </div>
            <div>
                <span class="field-label" data-i18n="seconds">Seconds</span>
                <div class="seg-group">
                    <button class="seg-btn" data-set="seconds=true" data-i18n="on">On</button>
                    <button class="seg-btn" data-set="seconds=false" data-i18n="off">Off</button>
                </div>
            </div>
        </div>

        <div class="field field-pair">
            <div>
                <span class="field-label" data-i18n="size">Size</span>
                <div class="seg-group">
                    <button class="seg-btn" data-set="size=s" data-i18n="size_s">S</button>
                    <button class="seg-btn" data-set="size=m" data-i18n="size_m">M</button>
                    <button class="seg-btn" data-set="size=l" data-i18n="size_l">L</button>
                </div>
            </div>
            <div>
                <span class="field-label" data-i18n="language">Language</span>
                <div class="seg-group">
                    <button class="seg-btn" data-set="lang=en" lang="en">EN</button>
                    <button class="seg-btn" data-set="lang=sv" lang="sv">SV</button>
                </div>
            </div>
        </div>
    </aside>

    <audio id="alarm-sound" preload="none"></audio>
</div>

<!-- Event card designer. Inert until the date is clicked for the first time;
     clock.js then loads event_card.css + event_card.js and clones this in. -->
<template id="ecm-template">
    <div class="ecm-overlay" id="ecm-overlay">
        <div class="ecm-modal" role="dialog" aria-modal="true" aria-labelledby="ecm-title-label">
            <div class="ecm-header">
                <span class="ecm-header-title" id="ecm-title-label">Create event card</span>
                <button class="icon-btn" id="ecm-close" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div class="ecm-body">
                <div class="ecm-col-form">

                    <div>
                        <label class="ecm-label" for="ecm-title">Title</label>
                        <input class="ecm-input" id="ecm-title" type="text" placeholder="Event name…" maxlength="80">
                    </div>

                    <div>
                        <label class="ecm-label" for="ecm-author">Author / contact</label>
                        <input class="ecm-input" id="ecm-author" type="text" placeholder="Name or email…" maxlength="80">
                    </div>

                    <div>
                        <label class="ecm-label" for="ecm-desc">Description — markdown supported</label>
                        <textarea class="ecm-textarea" id="ecm-desc" rows="5"
                            placeholder="# Heading&#10;**bold**, *italic*, `code`&#10;- list item"></textarea>
                    </div>

                    <div>
                        <span class="ecm-label">Date</span>
                        <div class="ecm-cal" id="ecm-cal"></div>
                    </div>

                    <div class="ecm-row-2">
                        <div>
                            <span class="ecm-label">Card theme</span>
                            <div class="ecm-toggle-row" id="ecm-theme-row">
                                <button class="ecm-toggle-btn active" data-theme="dark">Dark</button>
                                <button class="ecm-toggle-btn" data-theme="light">Light</button>
                            </div>
                        </div>
                        <div>
                            <span class="ecm-label">Date language</span>
                            <div class="ecm-toggle-row" id="ecm-lang-row">
                                <button class="ecm-toggle-btn active" data-lang="en">EN</button>
                                <button class="ecm-toggle-btn" data-lang="sv">SV</button>
                                <button class="ecm-toggle-btn" data-lang="off">Off</button>
                            </div>
                        </div>
                    </div>

                    <div class="ecm-row-2">
                        <div>
                            <span class="ecm-label">Align header</span>
                            <div class="ecm-toggle-row" id="ecm-align-row">
                                <button class="ecm-toggle-btn active" data-align="left">Left</button>
                                <button class="ecm-toggle-btn" data-align="center">Center</button>
                                <button class="ecm-toggle-btn" data-align="right">Right</button>
                            </div>
                        </div>
                        <div>
                            <span class="ecm-label">Author position</span>
                            <div class="ecm-toggle-row" id="ecm-author-pos-row">
                                <button class="ecm-toggle-btn active" data-author-pos="opposite">Opposite</button>
                                <button class="ecm-toggle-btn" data-author-pos="diagonal">Diagonal</button>
                            </div>
                        </div>
                    </div>

                    <div class="ecm-row-2">
                        <div>
                            <span class="ecm-label">Texture</span>
                            <div class="ecm-toggle-row" id="ecm-texture-row">
                                <button class="ecm-toggle-btn active" data-texture="false">Off</button>
                                <button class="ecm-toggle-btn" data-texture="true">On</button>
                            </div>
                        </div>
                        <div>
                            <span class="ecm-label">Justify text</span>
                            <div class="ecm-toggle-row" id="ecm-justify-row">
                                <button class="ecm-toggle-btn" data-justify="false">Off</button>
                                <button class="ecm-toggle-btn active" data-justify="true">On</button>
                            </div>
                        </div>
                    </div>

                    <div class="ecm-row-2">
                        <div>
                            <span class="ecm-label">Background graphic</span>
                            <div class="ecm-toggle-row" id="ecm-graphic-row">
                                <button class="ecm-toggle-btn active" data-graphic="ring">Ring</button>
                                <button class="ecm-toggle-btn" data-graphic="logo">Logo</button>
                                <button class="ecm-toggle-btn" data-graphic="none">Off</button>
                            </div>
                        </div>
                        <div>
                            <span class="ecm-label">Show title</span>
                            <div class="ecm-toggle-row" id="ecm-show-title-row">
                                <button class="ecm-toggle-btn active" data-show-title="true">On</button>
                                <button class="ecm-toggle-btn" data-show-title="false">Off</button>
                            </div>
                        </div>
                    </div>

                    <div class="ecm-row-2">
                        <div>
                            <label class="ecm-label" for="ecm-color-title">Title color</label>
                            <input class="ecm-color" type="color" id="ecm-color-title" value="#ffffff">
                        </div>
                        <div>
                            <label class="ecm-label" for="ecm-color-date">Date color</label>
                            <input class="ecm-color" type="color" id="ecm-color-date" value="#a1a1a1">
                        </div>
                    </div>

                    <div class="ecm-row-2">
                        <div>
                            <div class="ecm-slider-head">
                                <label class="ecm-label" for="ecm-font-scale">Font scale</label>
                                <span class="ecm-val" id="ecm-font-scale-val">1.00x</span>
                            </div>
                            <input type="range" class="ecm-slider" id="ecm-font-scale" min="0.9" max="8.0" step="0.05" value="1.5">
                        </div>
                        <div>
                            <div class="ecm-slider-head">
                                <label class="ecm-label" for="ecm-pad-scale">Edge padding</label>
                                <span class="ecm-val" id="ecm-pad-scale-val">1.00x</span>
                            </div>
                            <input type="range" class="ecm-slider" id="ecm-pad-scale" min="0.5" max="5.0" step="0.05" value="1.0">
                        </div>
                    </div>

                    <div class="ecm-row-2">
                        <div>
                            <span class="ecm-label">Columns</span>
                            <div class="ecm-toggle-row" id="ecm-columns-row">
                                <button class="ecm-toggle-btn active" data-columns="1">1</button>
                                <button class="ecm-toggle-btn" data-columns="2">2</button>
                                <button class="ecm-toggle-btn" data-columns="3">3</button>
                            </div>
                        </div>
                        <div>
                            <div class="ecm-slider-head">
                                <label class="ecm-label" for="ecm-pad-ratio" title="Horizontal vs vertical padding">Padding bias (Y↔X)</label>
                                <span class="ecm-val" id="ecm-pad-ratio-val">0.00</span>
                            </div>
                            <input type="range" class="ecm-slider" id="ecm-pad-ratio" min="-0.8" max="0.8" step="0.05" value="0">
                        </div>
                    </div>

                    <div>
                        <span class="ecm-label">Size</span>
                        <div class="ecm-formats" id="ecm-formats"></div>
                    </div>
                </div>

                <div class="ecm-col-preview">
                    <span class="ecm-label">Preview</span>
                    <div class="ecm-preview-wrap" id="ecm-preview-wrap">
                        <canvas id="ecm-canvas"></canvas>
                    </div>

                    <div>
                        <span class="ecm-label">File type</span>
                        <div class="ecm-toggle-row" id="ecm-filetype-row">
                            <button class="ecm-toggle-btn active" data-file-type="jpg">JPG</button>
                            <button class="ecm-toggle-btn" data-file-type="png">PNG</button>
                            <button class="ecm-toggle-btn" data-file-type="png_transp">PNG transp.</button>
                        </div>
                    </div>

                    <button class="btn" data-variant="primary" id="ecm-export-btn">Export card</button>
                </div>
            </div>
        </div>
    </div>
</template>

<script src="/clock/js/clock.js?v=20260919" defer></script>
</body>
</html>
